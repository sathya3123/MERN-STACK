<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>app flexbox</title>
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    background: #1c1b20;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(2, 250px);
    gap: 20px;
}

.card {
    padding: 20px;
    border-radius: 20px;
    color: #fff;
    width: 250px;
    background: #222;
    position: relative;
    box-shadow: 5px 5px 25px rgba(0,0,0,0.5);
}

.green { background: linear-gradient(135deg, #001, #007f56); }
.yellow { background: linear-gradient(135deg, #221400, #ff9d00); }
.red { background: linear-gradient(135deg, #2a0000, #ac1d1d); }
.blue { background: linear-gradient(135deg, #001933, #1c4aff); }

.date {
    font-size: 12px;
    opacity: 0.8;
}

h3 {
    margin-top: 10px;
    font-size: 17px;
    text-align: center;
}

p {
    font-size: 12px;
    opacity: 0.7;
    margin-bottom: 18px;
    text-align: center;
}

.progress-label {
    font-size: 12px;
    opacity: 0.8;
}

.progress-bar {
    width: 100%;
    height: 5px;
    background: rgba(255,255,255,0.2);
    border-radius: 5px;
    margin: 6px 0;
    overflow: hidden;
}

.progress-bar span {
    display: block;
    height: 100%;
    background: #fff;
    border-radius: 5px;
}

.percentage {
    font-size: 11px;
    text-align: right;
    margin-bottom: 10px;
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.avatars img {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    border: 2px solid #222;
    margin-right: -6px;
}

.time {
    font-size: 12px;
    background: #222;
    padding: 5px 10px;
    border-radius: 15px;
    opacity: 0.8;
}
</style>
</head>
<body>
    <div class="card-container">

    <div class="card green">
        <span class="date">Feb 2, 2021</span>
        <h3>Web Designing</h3>
        <p>Prototyping</p>

        <div class="progress-label">Progress</div>
        <div class="progress-bar"><span style="width: 90%;"></span></div>
        <div class="percentage">90%</div>

        <div class="bottom">
            <div class="avatars">
                <img src="https://i.pravatar.cc/35?img=1">
                <img src="https://i.pravatar.cc/35?img=2">
                <img src="https://i.pravatar.cc/35?img=3">
            </div>
            <div class="time">2 days left</div>
        </div>
    </div>

    <div class="card yellow">
        <span class="date">Feb 5, 2021</span>
        <h3>Mobile App</h3>
        <p>Shopping</p>

        <div class="progress-label">Progress</div>
        <div class="progress-bar"><span style="width: 30%;"></span></div>
        <div class="percentage">30%</div>

        <div class="bottom">
            <div class="avatars">
                <img src="https://i.pravatar.cc/35?img=4">
                <img src="https://i.pravatar.cc/35?img=5">
            </div>
            <div class="time">3 weeks left</div>
        </div>
    </div>

    <div class="card red">
        <span class="date">March 3, 2021</span>
        <h3>Dashboard</h3>
        <p>Medical</p>

        <div class="progress-label">Progress</div>
        <div class="progress-bar"><span style="width: 50%;"></span></div>
        <div class="percentage">50%</div>

        <div class="bottom">
            <div class="avatars">
                <img src="https://i.pravatar.cc/35?img=6">
                <img src="https://i.pravatar.cc/35?img=7">
            </div>
            <div class="time">2 weeks left</div>
        </div>
    </div>

    <div class="card blue">
        <span class="date">March 8, 2021</span>
        <h3>Web Designing</h3>
        <p>Wireframing</p>

        <div class="progress-label">Progress</div>
        <div class="progress-bar"><span style="width: 20%;"></span></div>
        <div class="percentage">20%</div>

        <div class="bottom">
            <div class="avatars">
                <img src="https://i.pravatar.cc/35?img=8">
                <img src="https://i.pravatar.cc/35?img=9">
            </div>
            <div class="time">2 weeks left</div>
        </div>
    </div>

</div>

</body>
</html>
