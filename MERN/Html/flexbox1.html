 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>social card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            
        }
        .container{
            background-color: white;
            color: black;
            display: flex;
            justify-content: center;
            
            
        }
        .card1{
            height: 430px;
            width: 220px;
            margin: 20px;
            background-color: #1c1a2a;
            color: white;
            margin-top: 160px;
        }
        .card1 img{
            height: 110px;
            width: 110px;
            border-radius: 50%;
            box-shadow: 0px 0px 20px 8px rgba(255, 0, 128, 0.7);
            margin-left: 60px;
            margin-bottom: 10px;
            margin-top: 20px;

        }
        .card1 .heading{
            text-align: center;
            margin-bottom: 10px;
            margin-top: 20px;
        }
        .card1 .content{
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            margin-top: 20px;
            
        }
        .card1 .icon{
            display: flex;
            justify-content: space-around;
            margin-bottom: 10px;
            margin-top: 20px;

        }
        .card1 .icon .icons{
            background-color: #ff007f;
            color: white;
            border-radius: 50%;
            padding: 8px;
        }
        .card1 .btn1,.card1 .btn2{
            margin-top: 15px;
            margin-bottom: 10px;
            width: 70%;
            margin-left: 30px;
            padding: 7px 10px;
            background: transparent;
            border: 2px solid #00bcd4;
            color: #00bcd4;
            cursor: pointer;
            
        }
    </style>
 </head>
 <body>
    <section class="container">
        <div class="card1">
            <img src="asset/image/img1.webp" alt="">
            <h3 class="heading">Lily-Grace colley</h3>
            <div class="content">
            <p> 156 Post </p>
            <p>1012 Likes</p>
            </div>
            <div class="icon">
            <div class="icons"><i class="fa-brands fa-twitter"></i></div>
            <div class="icons"><i class="fa-brands fa-facebook-f"></i></div>
            <div class="icons"><i class="fa-brands fa-whatsapp"></i></div>
            <div class="icons"><i class="fa-brands fa-linkedin-in"></i></div>
            </div>
            
            <button class="btn1">Follow</button><br>
            <button class="btn2">Message</button>
        
        </div>
        <div class="card1">
            <img src="asset/image/img1.webp" alt="">
            <h3 class="heading">Lily-Grace colley</h3>
            <div class="content">
            <p> 156 Post </p>
            <p>1012 Likes</p>
            </div>
            <div class="icon">

            <div class="icons"><i class="fa-brands fa-facebook-f"></i></div>
            <div class="icons"><i class="fa-brands fa-whatsapp"></i></div>
            <div class="icons"><i class="fa-brands fa-linkedin-in"></i></div>
            </div>
            
            <button class="btn1">Follow</button><br>
            <button class="btn2">Message</button>
        
        </div>
        <div class="card1">
            <img src="asset/image/img1.webp" alt="">
            <h3 class="heading">Lily-Grace colley</h3>
            <div class="content">
            <p> 156 Post </p>
            <p>1012 Likes</p>
            </div>
            <div class="icon">
            <div class="icons"><i class="fa-brands fa-twitter"></i></div>
            <div class="icons"><i class="fa-brands fa-facebook-f"></i></div>
            <div class="icons"><i class="fa-brands fa-whatsapp"></i></div>
            <div class="icons"><i class="fa-brands fa-linkedin-in"></i></div>
            </div>
            
            <button class="btn1">Follow</button><br>
            <button class="btn2">Message</button>
        
        </div>
    </section>
 </body>
 </html>
