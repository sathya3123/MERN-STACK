<!DOCTYPE html>
<html lang="en">
<head>
    <title>personal info using colspan and rowspan</title>
    <style>
        h1{
            text-align: center;
        }
        table{
            border-collapse: collapse;
            background-color: rgb(212, 255, 0);
            font-family:Arial, Helvetica, sans-serif;
        }
        th{
            background-color: rgb(0, 255, 42);
        }
        #info{
            background-color: rgb(30, 165, 210);
        }
        .data{
            background-color: blueviolet
        }
    </style>
</head>
<body>
    <h1><i><mark>personal information</mark></i></h1>
    <table>
        <table border="1" height="500px" width="500px" align="center" cellpadding="20">
            <thead>
                <tr>
                    <th id="info" colspan="2 ">personal information</th>
                </tr>
                <tr>
                    <th>Name:</th>
                    <td class="data">sathya</td>
                </tr>
                <tr>
                    <th class="data">qualification</th>
                    <td >B.Com</td>
                </tr>
                <tr>
                    <th>DOB</th>
                    <td class="data">3 dec 2003</td>
                </tr>
                <tr>
                    <th class="data">blood group:</th>
                    <td >o positive</td>
                </tr>
                <tr>
                    <th>college:</th>
                    <td class="data">Thiagarajar college</td>
                </tr>
                <tr>
                    <th class="data">district:</th>
                    <td>Madurai</td>
                </tr>
                <tr>
                    <th rowspan="100">skills:</th>
                    <td class="data">communication</td>
                </tr>
                <tr>
                   <td >interpersonal</td> 
                </tr>
                
                
            </thead>

    
    </table>
</body>
</html>
